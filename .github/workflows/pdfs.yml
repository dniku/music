name: Build score PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: score-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build score PDFs
        run: nix build --print-build-logs --out-link result-pdfs .#pdfs

      - name: Stage score PDFs
        run: |
          mkdir artifacts
          cp --dereference -- result-pdfs/*.pdf artifacts/
          sha256sum artifacts/*.pdf

      - name: Upload score PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: music-score-pdfs
          path: artifacts/*.pdf
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
