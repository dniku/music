name: Build score artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: score-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render scores
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build score artifacts
        run: nix build --print-build-logs --out-link result-artifacts .#artifacts

      - name: Stage score artifacts
        run: |
          mkdir artifacts
          cp --dereference -- result-artifacts/* artifacts/
          sha256sum artifacts/*

      - name: Upload Volki Okeana PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/atom-76--volki-okeana.pdf
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload Blown Away PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/moi-rakety-vverh--blown-away.pdf
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload Lost in Space PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/avantasia--lost-in-space.pdf
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload Volki Okeana MIDI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/atom-76--volki-okeana.midi
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload Blown Away MIDI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/moi-rakety-vverh--blown-away.midi
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload Lost in Space MIDI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts/avantasia--lost-in-space.midi
          if-no-files-found: error
          retention-days: 90
          archive: false
