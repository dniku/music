    desc: Основная транскрипция соло
    labels: [score, lilypond]
  blown-away-score-midi:
    path: build/e889154d-ae2d-43f0-bd2d-df87d068c0f3/score.midi
    type: midi
    desc: MIDI основной транскрипции соло
    labels: [midi, transcription]
