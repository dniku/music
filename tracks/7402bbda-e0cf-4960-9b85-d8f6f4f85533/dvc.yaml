stages:
  fetch-instrumental-reference:
    wdir: ../..
    cmd: >-
      nix run .#fetch-youtube-audio --
      https://www.youtube.com/watch?v=2Goi7VNlL7I 251
      9e07f7837e66556e575b9a28e3a944369d9c7e1a2a2e0e294976a32a9c90069a
      tracks/7402bbda-e0cf-4960-9b85-d8f6f4f85533/reference/audio/youtube-2Goi7VNlL7I.webm
    deps:
      - flake.nix
      - flake.lock
      - scripts/fetch-youtube-audio
    outs:
      - tracks/7402bbda-e0cf-4960-9b85-d8f6f4f85533/reference/audio/youtube-2Goi7VNlL7I.webm
  render-score:
    wdir: ../..
    cmd: nix run .#render-7402bbda-e0cf-4960-9b85-d8f6f4f85533
    deps:
      - flake.nix
      - flake.lock
      - tracks/7402bbda-e0cf-4960-9b85-d8f6f4f85533/score.ly
      - tracks/7402bbda-e0cf-4960-9b85-d8f6f4f85533/music.ily
    outs:
      - build/atom-76--volki-okeana/score.pdf
      - build/atom-76--volki-okeana/score.midi
  render-full-score-audition:
    wdir: ../..
    cmd: >-
      nix run .#render-midi-audition --
      build/atom-76--volki-okeana/score.midi
      build/atom-76--volki-okeana/full-score.mp3
    deps:
      - flake.nix
      - flake.lock
      - scripts/render-midi-audition
      - build/atom-76--volki-okeana/score.midi
    outs:
      - build/atom-76--volki-okeana/full-score.mp3
  extract-early-solo-reference:
